# rugmaps — Docker Compose
# Backend (FastAPI :8002) + Frontend (nginx :8080)
# Build: docker compose build
# Start: docker compose up -d
# Stop:  docker compose down

services:
  backend:
    image: rugmaps-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rugmaps-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    read_only: true
    tmpfs:
      - /tmp:size=50M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    image: rugmaps-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rugmaps-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=50M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
